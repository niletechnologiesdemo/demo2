<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asian Voyage — Waiter Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/pos.css">
<style>
  .wbar {
    display: flex; align-items: center; gap: 12px; padding: 11px 16px; flex: 0 0 auto;
    background: var(--paper-2); border-bottom: 1px solid var(--line);
  }
  .wbar h1 { font-size: 18px; }
  .wbody { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
  .wbody.flush { padding: 0; overflow: hidden; display: flex; }
  .mine { box-shadow: 0 0 0 2px var(--clay) inset; }
</style>
</head>
<body class="pos">
<div class="tabletstage">
  <div class="tablet">
    <div class="tablet-screen">
      <header class="wbar no-print" id="wbar"></header>
      <div class="wbody" id="wbody"></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet-head"><h3 id="mTitle"></h3><button class="icon-btn no-print" id="mClose" aria-label="Close"></button></div>
  <div class="sheet-body" id="mBody"></div>
  <div class="sheet-foot no-print" id="mFoot"></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="assets/menu-data.js"></script>
<script src="assets/av-icons.js"></script>
<script src="assets/pos-store.js"></script>
<script src="assets/pos-ui.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const { money, totals } = POS;

  let me = null;           // logged-in waiter
  let screen = 'floor';
  let orderId = null;
  let cat = AV_SECTIONS[0].cats[0];

  /* ------------------------------- login -------------------------------- */
  function login() {
    $('#wbar').innerHTML = '';
    $('#wbody').className = 'wbody';
    $('#wbody').innerHTML = `
      <div style="max-width:330px;margin:5vh auto 0;text-align:center">
        <img src="Logo.jpeg" alt="Asian Voyage" style="height:46px;margin:0 auto 20px">
        <h2 style="font-size:21px">Sign in</h2>
        <p class="muted small" style="margin:6px 0 4px">Enter your staff PIN</p>
        <div id="pad"></div>
        <p class="tiny muted" style="margin-top:16px">Demo PINs — Kwame 2222 · Leah 3333 · Terrence 4444</p>
      </div>`;
    UI.pinPad($('#pad'), pin => {
      const s = POS.staff.byPin(pin);
      if (!s) return UI.toast('PIN not recognised');
      if (s.role === 'manager' || s.role === 'cashier') {
        UI.toast(s.name + ' — use the billing counter screen'); return;
      }
      me = s; screen = 'floor'; render();
    });
  }

  /* ------------------------------- chrome ------------------------------- */
  function bar(title, back) {
    $('#wbar').innerHTML = `
      ${back ? `<button class="icon-btn" id="back">${icon('arrowLeft', 19)}</button>` : ''}
      <h1>${UI.esc(title)}</h1>
      <div class="row" style="margin-left:auto;gap:9px" id="barR"></div>`;
    if (back) $('#back').onclick = back;
    return $('#barR');
  }

  async function render() {
    if (!me) return login();
    if (screen === 'floor') return floor();
    if (screen === 'punch') return punch();
  }

  /* -------------------------------- floor ------------------------------- */
  async function floor() {
    const r = bar('Tables');
    r.innerHTML = `<span class="chip clay">${icon('user', 12)} ${UI.esc(me.name)}</span>
      <button class="btn btn-quiet btn-sm" id="out">Sign out</button>`;
    $('#out').onclick = () => { me = null; render(); };

    const tables = POS.tables.list();
    const mine = tables.filter(t => t.order && t.order.waiter === me.id).length;
    $('#wbody').className = 'wbody';
    $('#wbody').innerHTML = `
      <p class="muted small" style="margin-bottom:12px">${mine ? `You have <b>${mine}</b> table${mine > 1 ? 's' : ''} open.` : 'No open tables. Tap a free table to seat guests.'}</p>
      <div class="floor">${tables.map(t => {
        if (!t.order) return `<button class="tbl free" data-new="${t.n}">
          <div class="tn">${t.n}</div><div class="meta">Free</div>
          <div class="amt" style="color:var(--ink-soft);font-size:13px">Tap to seat</div></button>`;
        const tt = totals(t.order);
        const isMine = t.order.waiter === me.id;
        const pend = t.order.items.filter(i => i.kot === null && !i.voided).length;
        return `<button class="tbl ${t.status}${isMine ? ' mine' : ''}" data-open="${t.order.id}">
          <div class="between"><span class="tn">${t.n}</span>${UI.statusChip(t.order.status)}</div>
          <div class="meta">${t.order.guests} cover${t.order.guests > 1 ? 's' : ''} · ${UI.ago(t.order.openedAt)}</div>
          <div class="meta">${isMine ? '<b>You</b>' : UI.esc(POS.staff.name(t.order.waiter))}</div>
          ${pend ? `<span class="chip gold" style="margin-top:5px">${pend} to send</span>` : ''}
          <div class="amt">${money(tt.total)}</div></button>`;
      }).join('')}</div>`;

    $('#wbody').onclick = e => {
      const nw = e.target.closest('[data-new]'), op = e.target.closest('[data-open]');
      if (nw) return seat(+nw.dataset.new);
      if (op) { orderId = op.dataset.open; screen = 'punch'; render(); }
    };
  }

  function seat(table) {
    UI.modal(`Seat table ${table}`, `<label class="field"><span>How many covers?</span>
      <div class="row" style="gap:7px;flex-wrap:wrap" id="cov">
        ${[1,2,3,4,5,6,8,10].map(n => `<button class="btn btn-ghost" data-g="${n}" style="min-width:56px;font-size:17px">${n}</button>`).join('')}
      </div></label>`);
    $('#cov').onclick = async e => {
      const b = e.target.closest('[data-g]'); if (!b) return;
      const o = await POS.orders.create({ type: 'dine-in', table, guests: +b.dataset.g, waiter: me.id, openedBy: me.id });
      UI.close(); orderId = o.id; screen = 'punch'; render();
    };
  }

  /* -------------------------------- punch ------------------------------- */
  async function punch() {
    const o = await POS.orders.get(orderId);
    if (!o) { screen = 'floor'; return render(); }
    const t = totals(o);
    const pend = o.items.filter(i => i.kot === null && !i.voided);

    const r = bar(`Table ${o.table} · ${o.guests} covers`, () => { screen = 'floor'; render(); });
    r.innerHTML = `${UI.statusChip(o.status)}<span class="price" style="font-size:17px">${money(t.total)}</span>`;

    const cats = AV_SECTIONS.reduce((a, s) => a.concat(s.cats), []);
    const items = AV_MENU.filter(i => i.cat === cat);

    $('#wbody').className = 'wbody flush';
    $('#wbody').innerHTML = `<div class="punch">
      <div class="punch-menu">
        <div class="cat-rail">${cats.map(c => `<button data-c="${UI.esc(c)}" aria-pressed="${c === cat}">${UI.esc(c)}</button>`).join('')}</div>
        <div class="grid">${items.map(i => `<button class="tile" data-add="${i.id}">
          <b>${UI.esc(i.name)}</b>
          <span class="marks">${i.veg ? '<span class="mark mark-veg"></span>' : ''}${i.spicy ? icon('fire', 12) : ''}</span>
          <span class="price">${i.price != null ? money(i.price) : 'from ' + money(Math.min.apply(null, i.variants.map(v => v.p)))}</span>
        </button>`).join('')}</div>
      </div>

      <div class="ticket">
        <div class="ticket-head"><div class="between">
          <div><b style="font-size:15px">${UI.esc(o.code)}</b>
            <div class="tiny muted">${o.items.filter(i => !i.voided).reduce((n, i) => n + i.qty, 0)} items</div></div>
          ${pend.length ? `<span class="chip gold">${pend.length} not sent</span>` : `<span class="chip green">All sent</span>`}
        </div></div>

        <div class="ticket-lines" id="tl">${o.items.length ? o.items.map(i => {
          const cls = i.voided ? 'void' : i.comp ? 'comp' : i.kot !== null ? 'fired' : '';
          return `<div class="tline ${cls}">
            <span class="grow">
              <span class="nm">${i.qty}× ${UI.esc(i.name)}</span>
              ${i.variant ? `<span class="sub">${UI.esc(i.variant)}</span>` : ''}
              ${i.notes ? `<span class="sub" style="color:var(--clay)">${icon('edit', 10)} ${UI.esc(i.notes)}</span>` : ''}
              ${i.voided ? `<span class="sub" style="color:var(--red)">Voided</span>` : ''}
              <span class="row" style="gap:5px;margin-top:5px">
                <span class="kotdot ${i.kot === null ? 'pending' : ''}">${i.kot === null ? 'NOT SENT' : 'KOT ' + i.kot}</span>
                ${i.kot === null && !i.voided ? `<button class="btn-quiet tiny" data-edit="${i.uid}" style="padding:2px 6px">Edit</button>` : ''}
              </span>
            </span>
            <span class="amt">${i.comp ? '—' : money(i.price * i.qty)}</span></div>`;
        }).join('') : `<div class="empty" style="padding:30px 10px">${icon('receipt', 28)}<p class="small">Tap items to build the order</p></div>`}</div>

        <div class="ticket-foot">
          <div class="trow"><span class="muted">Subtotal</span><span class="num">${money(t.gross)}</span></div>
          <div class="trow"><span class="muted">Service ${t.servicePct}%</span><span class="num">${money(t.service)}</span></div>
          <div class="trow grand"><span>Total</span><span class="price">${money(t.total)}</span></div>

          <button class="btn ${pend.length ? 'btn-primary' : 'btn-ghost'} btn-block" id="send" style="margin-top:11px" ${pend.length ? '' : 'disabled'}>
            ${icon('chef', 16)} ${pend.length ? `Send ${pend.length} to kitchen` : 'Kitchen up to date'}</button>
          <button class="btn btn-dark btn-block" id="close" style="margin-top:7px" ${o.items.filter(i => !i.voided).length && !pend.length ? '' : 'disabled'}>
            ${icon('check', 16)} Close — ready for billing</button>
          <button class="btn btn-quiet btn-block tiny" id="park" style="margin-top:4px">Back to tables</button>
        </div>
      </div>
    </div>`;

    $('.cat-rail').onclick = e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; punch(); } };
    $('.grid').onclick = e => { const b = e.target.closest('[data-add]'); if (b) addItem(o, b.dataset.add); };
    $('#tl').onclick = e => { const b = e.target.closest('[data-edit]'); if (b) editLine(o, b.dataset.edit); };
    $('#park').onclick = () => { screen = 'floor'; render(); };
    $('#send').onclick = async () => {
      try {
        const upd = await POS.orders.fireKOT(o.id, me.id);
        const n = upd.kotBatches[upd.kotBatches.length - 1].n;
        UI.toast('Sent to kitchen — KOT #' + n, 'good');
        punch();
      } catch (err) { UI.toast(err.message); }
    };
    $('#close').onclick = async () => {
      try {
        await POS.orders.closeOrder(o.id, me.id);
        UI.toast('Table ' + o.table + ' ready for billing', 'good');
        screen = 'floor'; render();
      } catch (err) { UI.toast(err.message); }
    };
  }

  async function addItem(o, id) {
    const it = AV_MENU.find(i => i.id === id);
    if (!it.variants) {
      await POS.orders.addItems(o.id, [{ id: it.id, name: it.name, price: it.price, qty: 1 }], me.id);
      return punch();
    }
    UI.modal(it.name, `${it.desc ? `<p class="muted small" style="margin-bottom:12px">${UI.esc(it.desc)}</p>` : ''}
      <div class="stack">${it.variants.map(v =>
        `<button class="tile" style="flex-direction:row;align-items:center;min-height:0" data-v="${UI.esc(v.l)}" data-p="${v.p}">
          <span class="grow"><b>${UI.esc(v.l)}</b></span><span class="price">${money(v.p)}</span></button>`).join('')}</div>`);
    $('#mBody').onclick = async e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      await POS.orders.addItems(o.id, [{ id: it.id, name: it.name, price: +b.dataset.p, qty: 1, variant: b.dataset.v }], me.id);
      UI.close(); punch();
    };
  }

  /* Waiters can adjust anything the kitchen has not seen yet. Once it is fired
     they have to ask the counter — that is where the manager PIN lives. */
  async function editLine(o, uid) {
    const fresh = await POS.orders.get(o.id);
    const l = fresh.items.find(i => i.uid === uid);
    let q = l.qty;
    UI.modal(l.name, `
      <div class="between" style="margin-bottom:16px"><b>Quantity</b>
        <span class="qty"><button id="qm">${icon('minus', 17)}</button><span id="qv">${q}</span><button id="qp">${icon('plus', 17)}</button></span></div>
      <label class="field"><span>Note for the kitchen</span>
        <input class="input" id="ln" value="${UI.esc(l.notes)}" placeholder="No peanuts, extra spicy, allergy…"></label>
      <button class="btn btn-danger btn-block" id="rm" style="margin-top:6px">${icon('trash', 15)} Remove from order</button>`,
      `<button class="btn btn-primary btn-block" id="ok">Save</button>`);
    const sync = () => { $('#qv').textContent = q; $('#qm').disabled = q <= 1; };
    $('#qm').onclick = () => { if (q > 1) { q--; sync(); } };
    $('#qp').onclick = () => { q++; sync(); }; sync();
    $('#ok').onclick = async () => {
      await POS.orders.setQty(o.id, uid, q);
      await POS.orders.setNote(o.id, uid, $('#ln').value.trim());
      UI.close(); punch();
    };
    $('#rm').onclick = async () => {
      await POS.orders.voidLine(o.id, uid, 'Wrong item punched', me.id);
      UI.close(); UI.toast('Removed', 'good'); punch();
    };
  }

  UI.init();
  POS.subscribe(() => { if (me) render(); });
  render();
})();
</script>
</body>
</html>
