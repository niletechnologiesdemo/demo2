<style>
  .acct { display: flex; align-items: center; gap: 16px; background: #fff; border: 2.5px solid var(--line); border-radius: var(--r); padding: 20px 22px; cursor: pointer; transition: all .14s; margin-bottom: 14px; text-align: left; width: 100%; }
  .acct:hover { border-color: var(--sun); transform: translateY(-2px); box-shadow: var(--sh); }
  .acct .a-av { width: 52px; height: 52px; border-radius: 15px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-family: var(--font-head); font-size: 16px; flex-shrink: 0; }
  .acct b { display: block; font-size: 15.5px; }
  .acct span { font-size: 12.5px; color: var(--ink-soft); }
  .acct .go-ic { margin-left: auto; color: var(--ink-faint); }
  .match-bar { display: flex; align-items: center; gap: 9px; }
  .match-bar .mb { width: 92px; height: 8px; background: #EFE8DA; border-radius: 999px; overflow: hidden; }
  .match-bar .mb i { display: block; height: 100%; background: var(--g-green); border-radius: 999px; }
  .vet-row { background: #fff; border: 2px solid var(--line-2); border-radius: var(--r); padding: 18px 20px; margin-bottom: 14px; }
  .vet-row.out { opacity: .5; }
  .vet-status { display: flex; gap: 7px; flex-wrap: wrap; }
  .vet-status button { border: 2px solid var(--line); background: #fff; border-radius: 999px; font-size: 12px; font-weight: 800; padding: 6px 14px; color: var(--ink-faint); transition: all .12s; }
  .vet-status button:hover { border-color: var(--sun); color: var(--sun-2); }
  .vet-status button.on-contacted { background: var(--sky-soft); border-color: var(--sky); color: var(--sky); }
  .vet-status button.on-vetted { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .vet-status button.on-out { background: #F1EBE0; border-color: var(--ink-faint); color: var(--ink-soft); }
  .stage-banner { border-radius: var(--r); padding: 20px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .stage-banner.waiting { background: var(--indigo-soft); color: var(--indigo); }
  .stage-banner.act { background: var(--gold-soft); color: var(--gold-text); }
  .stage-banner.done { background: var(--green-soft); color: var(--green); }
  .stage-banner b { font-size: 15px; }
  .stage-banner p { font-size: 13px; opacity: .85; }
  .sched-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 14px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line-2); }
  .sched-row input { border: 2px solid var(--line); border-radius: 11px; padding: 10px 12px; font-size: 13.5px; }
  .slot-card { background: #fff; border-radius: var(--r); box-shadow: var(--sh-sm); padding: 20px; }
  .slot-card h4 { font-size: 14px; margin-bottom: 6px; }
  .access-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; padding: 4px 11px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); margin: 0 5px 5px 0; }
  .res-mini { display: flex; align-items: center; gap: 14px; padding: 15px 17px; background: var(--bg); border-radius: 14px; margin-bottom: 12px; }
  .res-mini .r-ic { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  @media (max-width: 820px) { .sched-row { grid-template-columns: 1fr; } }
</style>
</head>

/* ================= helpers ================= */
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = icon('checkCircle', 18) + msg;
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3400);
}
function openModal(html, wide) {
  const bg = document.getElementById('modal-bg'), box = document.getElementById('modal-box');
  box.className = 'modal' + (wide ? ' wide' : ''); box.innerHTML = html; bg.classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
document.getElementById('modal-bg').addEventListener('click', e => { if (e.target.id === 'modal-bg') closeModal(); });
function statusChip(i) {
  const map = { 1: 'sky', 2: 'sun', 3: 'indigo', 4: 'teal', 5: 'green' };
  return '<span class="chip ' + map[i] + '">' + CASE_STATUSES[i - 1] + '</span>';
}
function role() { return ROLES[S.role]; }
function inScope(prog) { return !role().programs || role().programs.includes(prog); }
function myCases() { return S.cases.filter(c => inScope(c.prog)); }
function c7Status() { return ({ vetting: 2, shared: 3, selected: 3, scheduled: 4, closed: 5 })[S.c7.stage]; }

function login(r) {

  document.getElementById('app-root').style.display = '';
  render();
  toast('Signed in as ' + ROLES[r].name + ' — ' + ROLES[r].scope);
}
function logout() {
  S.authed = false; S.role = null;
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('auth-root').style.display = '';
  renderAuth(); window.scrollTo({ top: 0 });

function closeCase7() {
  const hires = [];
  document.querySelectorAll('.hire-cb').forEach(cb => {
    if (cb.checked) {
      const v = S.c7.cands.find(x => x.id === cb.dataset.id);
      const sal = parseInt(document.getElementById('sal-' + v.id).value) || 36000;
      hires.push({ name: v.name, role: v.id === 'v2' ? 'Sales Lead' : 'Sales Executive', salary: sal, fee: Math.round(sal / 12 * 3 * 0.15) });
    }
  });
  if (!hires.length) { toast('Select at least one hire'); return; }
  S.c7.hires = hires; S.c7.stage = 'closed';
  S.invoices.unshift({ id: 'INV-2026-052', emp: 'Nile Technologies', for: 'Sales Agents × ' + hires.length + ' (CASE-1007)', amt: hires.reduce((a, h) => a + h.fee, 0), status: 'Due Sep 03' });
  closeModal(); render();
  toast('Case closed — contract sent, invoice INV-2026-052 issued, candidates notified');
}

  return `

    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Company</th><th>Industry</th><th>Since</th><th>Requests</th><th>Hires</th><th>Agreement</th><th></th></tr></thead>
      <tbody>${S.employers.map((e, i) => `
        <tr>
          <td><b>${e.name}</b></td><td class="muted">${e.ind}</td><td class="muted">${e.since}</td>
          <td>${e.requests}</td><td>${e.hires}</td>
          <td><span class="chip ${e.pending ? 'sun' : 'green'}">${e.sa}</span></td>
          <td>${e.pending ? '<button class="btn btn-primary btn-sm" onclick="approveEmp(' + i + ')">' + icon('check', 14) + ' Approve</button>' : '<button class="btn btn-ghost btn-sm" onclick="toast(\'Employer record opens in the live system\')">Open</button>'}</td>
        </tr>`).join('')}

function approveEmp(i) {
  S.employers[i].pending = false;

  render(); toast('Sunset Marina Ltd. approved — Retail & Services agreement sent for e-signature');
}

function previewAd(key) {

function newAdv() {
  openModal(`

function approveAd(i) {
  S.advertisers[i].status = 'Active'; S.advertisers[i].until = 'Nov 2026';

/* ---------- billing ---------- */
function vBilling() {
  const out = S.invoices.filter(v => v.status.startsWith('Due')).reduce((a, v) => a + v.amt, 0);
  const paid = S.invoices.filter(v => v.status === 'Paid').reduce((a, v) => a + v.amt, 0);
  return `
  <div class="stats rise">
    <div class="stat"><span class="s-ic g-green">${icon('trendingUp', 20)}</span><b>$${paid.toLocaleString()}</b><span>Collected (YTD)</span></div>
    <div class="stat"><span class="s-ic g-sun">${icon('clock', 20)}</span><b>$${out.toLocaleString()}</b><span>Outstanding</span></div>
    <div class="stat"><span class="s-ic g-teal">${icon('users', 20)}</span><b>$4,210</b><span>Registration fees (YTD)</span></div>
    <div class="stat"><span class="s-ic g-indigo">${icon('megaphone', 20)}</span><b>$550</b><span>Ad revenue / month</span></div>
  </div>
  <div class="panel rise">
    <div class="panel-head"><h2><span class="h-ic" style="background:var(--g-sun)">${icon('receipt', 17)}</span> Placement invoices</h2><span class="spacer"></span><button class="btn btn-primary btn-sm" onclick="toast('Manual invoice builder opens in the live system')">${icon('plus', 15)} New invoice</button></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Invoice</th><th>Employer</th><th>Placement</th><th>Amount</th><th>Status</th><th></th></tr></thead>
      <tbody>${S.invoices.map((v, i) => `
        <tr>
          <td><b>${v.id}</b></td><td>${v.emp}</td><td class="muted">${v.for}</td>
          <td><b>$${v.amt.toLocaleString()}</b></td>
          <td><span class="chip ${v.status === 'Paid' ? 'green' : 'sun'}">${v.status}</span></td>
          <td>${v.status === 'Paid' ? '<button class="btn btn-ghost btn-sm" onclick="toast(\'Invoice PDF would download\')">' + icon('download', 14) + '</button>' : '<button class="btn btn-soft btn-sm" onclick="recordPay(' + i + ')">Record payment</button>'}</td>
        </tr>`).join('')}
      </tbody></table></div>
    <div class="strip sun mt-16">${icon('percent', 18)}<div><p>Fees auto-calculate at case closure: rate (by placement type &amp; industry agreement) × first 3 months' salary. Payments are collected offline and recorded here.</p></div></div>
  </div>`;
}
function recordPay(i) { S.invoices[i].status = 'Paid'; render(); toast(S.invoices[i].id + ' marked as paid'); }

    ${S.resources.map((r, i) => `
      <div class="res-mini">

      <thead><tr><th>Program</th><th>Candidates</th><th>Registration fee</th><th>Officer</th><th></th></tr></thead>

  openModal(`

    <div class="form-grid">

/* ================= shell ================= */
const VIEWS = { dash: vDash, cases: vCases, case7: vCase7, postings: vPostings, pool: vPool, interviews: vInterviews, employers: vEmployers, ads: vAds, billing: vBilling, resources: vResources, programs: vPrograms, agreements: vAgreements, staff: vStaff };
function go(v) { S.view = v; render(); window.scrollTo({ top: 0 }); }
function render() {
  const isMaster = !role().programs;
  const nav = isMaster ? NAV_MASTER : NAV_STAFF;
  const heroKey = S.view === 'case7' ? 'case7' : S.view;
  document.getElementById('app-root').innerHTML = `
  <div class="portal">
    <aside class="side">
      <div class="side-brand">
        <span class="logo-chip"><img src="cch-logo.jpeg" alt="Cheetahs Career Hub crest logo"></span>
        <div><b>Cheetahs Career Hub</b><span>${isMaster ? 'Admin Console' : 'Staff Console'}</span></div>
      </div>
      ${nav.map(n => n[0] === 'label'
        ? '<div class="side-label">' + n[1] + '</div>'
        : '<button class="snav ' + ((S.view === n[0] || (S.view === 'case7' && n[0] === 'cases')) ? 'on' : '') + '" onclick="go(\'' + n[0] + '\')">' + icon(n[1] === 'megaphone2' ? 'megaphone' : n[1], 19) + n[2] + (n[3] ? '<span class="badge">' + n[3] + '</span>' : '') + '</button>').join('')}
      <div class="side-user">
        <span class="avatar" style="background:${role().grad};color:${role().fg}">${role().initials}</span>
        <div><b>${role().name}</b><span>${role().title}</span></div>
        <button class="lo" onclick="logout()" title="Sign out / switch role">${icon('logout', 17)}</button>
      </div>
    </aside>
    <main class="main"><div class="main-inner">
      <div class="page-hero" style="background:var(--g-admin)">
        <div><h1>${HERO_TXT[heroKey][0]}</h1><div class="sub">${HERO_TXT[heroKey][1]}</div></div>
        <div class="spacer"></div>
        <div class="hero-actions">
          <button class="btn btn-white btn-sm" onclick="logout()">${icon('refresh', 15)} Switch role</button>
          <button class="iconbtn" onclick="notifs()">${icon('bell', 19)}<span class="dot"></span></button>
        </div>
      </div>
      <div id="view">${VIEWS[S.view]()}</div>
    </div></main>
  </div>`;
}
function notifs() {
  openModal(`
    <div class="modal-head"><h3>Notifications</h3><button class="mclose" onclick="closeModal()">${icon('x', 20)}</button></div>
    <div class="note-item"><span class="n-dot" style="background:var(--sky)"></span><div><b>New job request</b> — Oceanic Cruise Lines, Guest Services × 6 (CASE-1009)<br><span class="n-when">Aug 13, 8:15 AM</span></div></div>
    <div class="note-item"><span class="n-dot"></span><div><b>Employer awaiting approval</b> — Sunset Marina Ltd.<br><span class="n-when">Aug 12, 4:44 PM</span></div></div>
    <div class="note-item"><span class="n-dot" style="background:var(--indigo)"></span><div><b>Ad slot request</b> — Island Office Supplies, employer sidebar<br><span class="n-when">Aug 12, 11:30 AM</span></div></div>
    <div class="note-item"><span class="n-dot" style="background:var(--sun-2)"></span><div>Invoice INV-2026-051 due Aug 25 — Nile Technologies<br><span class="n-when">Aug 11, 9:00 AM</span></div></div>
  `);
}
renderAuth();
