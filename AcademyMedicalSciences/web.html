<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Academy of Medical Science · Web Application</title>
<meta name="description" content="Enrol in accredited healthcare training, study the theory online and book your in-person practical sessions." />
<link rel="icon" href="assets/img/ams-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/ams.css?v=2" />
<link rel="stylesheet" href="assets/web.css?v=2" />
</head>
<body>
<script src="assets/icons.js"></script>
<div id="app"></div>
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()"><div id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="assets/data.js"></script>
<script>
/* =====================================================================
   Academy of Medical Science — web application demonstration
   Single-file front end: marketing site, enrolment & payment, and the
   signed-in student portal (content delivery, scheduling, certificates).
   ===================================================================== */

const I  = (id,c='ic') => `<svg class="${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const IMG = n => `assets/img/${n}.jpg`;
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- application state ---------- */
const APP = {
  view:'home', id:null,
  signedIn:false,
  filter:{cat:'all', fmt:'all', q:''},
  checkout:{step:1, plan:'full', method:'card'},
  learn:{course:null, m:0, l:0, done:{}, quizPicked:null},
  pendingEnrol:null,
  enrolments:STUDENT.enrolments.map(e=>({...e}))
};

/* ---------- routing ---------- */
function go(view,id){
  APP.view=view; APP.id=id||null;
  location.hash = '#/'+view+(id?'/'+id:'');
  render(); window.scrollTo({top:0,behavior:'instant'});
}
function readHash(){
  const p=(location.hash||'#/home').replace(/^#\//,'').split('/');
  const v=p[0]||'home';
  const guarded=['dash','learn','schedule','certs','billing','profile'];
  if(guarded.includes(v) && !APP.signedIn){ APP.view='signin'; APP.id=null; return; }
  APP.view=v; APP.id=p[1]||null;
}
window.addEventListener('hashchange',()=>{readHash();render();});

/* ---------- small ui helpers ---------- */
let toastT;
function toast(msg,icon='i-check-c'){
  const t=document.getElementById('toast');
  t.innerHTML=I(icon)+'<span>'+esc(msg)+'</span>'; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
function openModal(html){
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('mask').classList.add('open');
}
function closeModal(){ document.getElementById('mask').classList.remove('open'); }
function toggleMob(){ document.getElementById('mobnav').classList.toggle('open'); }

const fmtBadge = f => f==='Online' ? `<span class="badge b-blue">${I('i-globe','ic-sm')}Online</span>`
  : f==='In-person' ? `<span class="badge b-teal">${I('i-pin','ic-sm')}In-person</span>`
  : `<span class="badge b-violet">${I('i-modules','ic-sm')}Hybrid</span>`;

const starRow = (r,n) => `<span class="stars">${I('i-star')}${r.toFixed(1)}<em>(${n})</em></span>`;

/* =====================================================================
   PUBLIC CHROME
   ===================================================================== */
const NAVLINKS = [['Programs','catalogue'],['Hybrid Model','#hybrid'],['Instructors','#tutors'],['About','#about'],['Contact','#contact']];

function header(active){
  const link = ([label,to]) => to.startsWith('#')
    ? `<a href="${to}" onclick="hashJump(event,'${to}')">${label}</a>`
    : `<a href="#/${to}" class="${active===to?'on':''}">${label}</a>`;
  return `
  <header class="hdr" id="hdr"><div class="wrap in">
    <a class="logo" href="#/home">
      <img src="assets/img/ams-logo.png" alt="Academy of Medical Science" />
      <span class="lt"><b>Academy of Medical Science</b><span>Helping you succeed</span></span>
    </a>
    <nav class="nav">${NAVLINKS.map(link).join('')}</nav>
    <div class="hdr-cta">
      ${APP.signedIn
        ? `<a class="btn btn-primary btn-sm" href="#/dash">${I('i-home','ic-sm')}My Learning</a>`
        : `<a class="btn btn-ghost btn-sm" href="#/signin">Sign in</a>
           <a class="btn btn-primary btn-sm" href="#/catalogue">Enrol now</a>`}
      <button class="burger" onclick="toggleMob()" aria-label="Menu">${I('i-menu','ic-lg')}</button>
    </div>
  </div></header>
  <div class="mob" id="mobnav">
    ${NAVLINKS.map(([l,t])=>t.startsWith('#')
      ? `<a href="${t}" onclick="toggleMob();hashJump(event,'${t}')">${l}</a>`
      : `<a href="#/${t}" onclick="toggleMob()">${l}</a>`).join('')}
    ${APP.signedIn
      ? `<a class="btn btn-primary btn-block" href="#/dash" onclick="toggleMob()">My Learning</a>`
      : `<a class="btn btn-ghost btn-block" href="#/signin" onclick="toggleMob()">Sign in</a>
         <a class="btn btn-primary btn-block" href="#/catalogue" onclick="toggleMob()">Enrol now</a>`}
  </div>`;
}
function hashJump(e,sel){
  const el=document.querySelector(sel);
  if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth',block:'start'}); }
  else { e.preventDefault(); go('home'); setTimeout(()=>document.querySelector(sel)?.scrollIntoView({behavior:'smooth'}),80); }
}

function footer(){ return `
<footer class="ftr" id="contact"><div class="wrap">
  <div class="cols">
    <div>
      <img class="lg" src="assets/img/ams-logo-white.png" alt="Academy of Medical Science" />
      <p style="font-size:.86rem;line-height:1.65;max-width:30ch">Job-ready short health professional courses for doctors, IMGs, nurses, technologists and all healthcare backgrounds.</p>
    </div>
    <div>
      <h5>Programs</h5>
      ${COURSES.filter(c=>c.featured).map(c=>`<a href="#/course/${c.id}" style="display:block">${esc(c.name)}</a>`).join('')}
      <a href="#/catalogue" style="display:block">View all programs</a>
    </div>
    <div>
      <h5>For Students</h5>
      <a href="#/signin" style="display:block">Student sign in</a>
      <a href="#/catalogue" style="display:block">Enrol in a program</a>
      <a href="#hybrid" style="display:block">How the hybrid model works</a>
      <a href="#tutors" style="display:block">Our instructors</a>
    </div>
    <div>
      <h5>Contact</h5>
      <div class="ct">${I('i-pin','ic-sm')}<span>${ACADEMY.address}</span></div>
      <div class="ct">${I('i-phone','ic-sm')}<span>${ACADEMY.phone}<br/>${ACADEMY.cell}</span></div>
      <div class="ct">${I('i-mail','ic-sm')}<span>${ACADEMY.email}</span></div>
      <div class="ct">${I('i-globe','ic-sm')}<span>${ACADEMY.site}</span></div>
    </div>
  </div>
  <div class="btm">
    <span>© 2026 ${ACADEMY.name}. All rights reserved.</span>
    <span>Design mock-up prepared by Nile Technologies</span>
  </div>
</div></footer>`; }

/* ---------- course card ---------- */
function courseCard(c){
  return `<button class="cc rv" onclick="go('course','${c.id}')">
    <div class="ph">
      <div class="tags">${fmtBadge(c.format)}${c.accredited?`<span class="badge b-green">${I('i-shield','ic-sm')}Accredited</span>`:''}</div>
      <img src="${IMG(c.img)}" alt="${esc(c.name)}" loading="lazy" />
      <span class="fee">${money(c.price)}</span>
    </div>
    <div class="bd">
      <div class="sub">${esc(c.sub)}</div>
      <h3>${esc(c.name)}</h3>
      <p>${esc(c.blurb)}</p>
      <div class="meta">
        <i>${I('i-clock','ic-sm')}${c.weeks===1?'1 week':c.weeks+' weeks'}</i>
        <i>${I('i-modules','ic-sm')}${c.modules.length} modules</i>
        ${starRow(c.rating,c.reviews)}
      </div>
    </div>
  </button>`;
}

/* =====================================================================
   CATALOGUE
   ===================================================================== */
function viewCatalogue(){
  const f=APP.filter;
  let list=COURSES.filter(c=>
    (f.cat==='all'||c.cat===f.cat) &&
    (f.fmt==='all'||c.format===f.fmt) &&
    (!f.q || (c.name+' '+c.sub+' '+c.blurb+' '+c.audience.join(' ')).toLowerCase().includes(f.q.toLowerCase()))
  );
  return header('catalogue') + `
  <section style="background:var(--surface);border-bottom:1px solid var(--line)" class="pad-s"><div class="wrap">
    <span class="eyebrow">Program catalogue</span>
    <h1 class="display" style="font-size:clamp(2rem,4vw,3rem);margin:12px 0 14px">Job-ready short <em>health professional courses</em></h1>
    <p style="font-size:1rem;color:var(--ink-2);max-width:60ch;line-height:1.66">Every programme below is open for enrolment. Fees are one-time and include all online content, materials and your in-person practical sessions.</p>
  </div></section>

  <section class="pad-s"><div class="wrap">
    <div class="fbar">
      <div class="srch">${I('i-search')}
        <input class="inp" id="q" placeholder="Search programs, skills or audience…" value="${esc(f.q)}"
          oninput="APP.filter.q=this.value;renderList()" />
      </div>
      <div class="sp"></div>
      <button class="pill ${f.cat==='all'?'on':''}" onclick="APP.filter.cat='all';renderList()">All</button>
      ${CATS.map(c=>`<button class="pill ${f.cat===c.id?'on':''}" onclick="APP.filter.cat='${c.id}';renderList()">${c.name}</button>`).join('')}
      <select class="inp" style="width:auto;min-width:132px" onchange="APP.filter.fmt=this.value;renderList()">
        ${['all','Hybrid','Online','In-person'].map(v=>`<option value="${v}" ${f.fmt===v?'selected':''}>${v==='all'?'Any format':v}</option>`).join('')}
      </select>
    </div>
    <div id="list">${listBody(list)}</div>
  </div></section>` + footer();
}
function listBody(list){
  if(!list.length) return `<div class="empty"><div class="ic-w">${I('i-search','ic-lg')}</div>
    <h3>No programs match that</h3><p>Try clearing the filters or searching for a broader term such as “phlebotomy” or “nurse”.</p>
    <button class="btn btn-ghost" onclick="APP.filter={cat:'all',fmt:'all',q:''};go('catalogue')">Clear filters</button></div>`;
  return `<p style="font-size:.83rem;font-weight:700;color:var(--ink-3);margin-bottom:18px">${list.length} program${list.length>1?'s':''}</p>
    <div class="grid">${list.map(courseCard).join('')}</div>`;
}
function renderList(){
  const f=APP.filter;
  const list=COURSES.filter(c=>
    (f.cat==='all'||c.cat===f.cat) &&
    (f.fmt==='all'||c.format===f.fmt) &&
    (!f.q || (c.name+' '+c.sub+' '+c.blurb+' '+c.audience.join(' ')).toLowerCase().includes(f.q.toLowerCase())));
  document.getElementById('list').innerHTML=listBody(list);
  document.querySelectorAll('.fbar .pill').forEach(p=>p.classList.remove('on'));
  const pills=document.querySelectorAll('.fbar .pill');
  const idx = f.cat==='all'?0:CATS.findIndex(c=>c.id===f.cat)+1;
  if(pills[idx]) pills[idx].classList.add('on');
  observe();
}

/* =====================================================================
   COURSE DETAIL
   ===================================================================== */
function viewCourse(){
  const c=byId(APP.id); if(!c) return viewCatalogue();
  const enrolled = APP.signedIn && APP.enrolments.some(e=>e.course===c.id);
  const online = c.modules.filter(m=>!m.inPerson), campus = c.modules.filter(m=>m.inPerson);
  const campusHrs = campus.reduce((s,m)=>s+m.lessons.reduce((t,l)=>t+l.len,0),0);
  return header('catalogue') + `
  <section class="cdetail">
    <div style="position:absolute;inset:0;opacity:.22"><img src="${IMG(c.img)}" alt="" style="width:100%;height:100%;object-fit:cover" /></div>
    <div style="position:absolute;inset:0;background:linear-gradient(100deg,var(--navy) 34%,rgba(6,42,87,.72))"></div>
    <div class="wrap in">
      <div class="crumb"><a href="#/home">Home</a>${I('i-right','ic-sm')}<a href="#/catalogue">Programs</a>${I('i-right','ic-sm')}<span style="color:#fff">${esc(c.name)}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${fmtBadge(c.format)}${c.accredited?`<span class="badge b-green">${I('i-shield','ic-sm')}Accredited</span>`:''}<span class="badge" style="background:rgba(255,255,255,.14);color:#fff">${esc(c.sub)}</span></div>
      <h1>${esc(c.name)}</h1>
      <p class="lede">${esc(c.blurb)}</p>
      <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">

function seedDone(c,e){
  const d={}; if(!e) return d;
  const total=lessonCount(c); let n=Math.round(total*e.progress/100), i=0;
  c.modules.forEach((m,mi)=>m.lessons.forEach((l,li)=>{ if(i++<n) d[mi+'-'+li]=true; }));
  return d;
}
function jump(m,l){ APP.learn.m=m; APP.learn.l=l; APP.learn.quizPicked=null; render(); }
function stepLesson(dir){
  const c=byId(APP.learn.course); let {m,l}=APP.learn;
  l+=dir;
  if(l<0){ m--; if(m<0){m=0;l=0;} else l=c.modules[m].lessons.length-1; }
  if(l>=c.modules[m].lessons.length){ if(m<c.modules.length-1){m++;l=0;} else l=c.modules[m].lessons.length-1; }
  APP.learn.m=m; APP.learn.l=l; APP.learn.quizPicked=null; render();
}
function markDone(){
  const c=byId(APP.learn.course);
  APP.learn.done[APP.learn.m+'-'+APP.learn.l]=true;
  const e=APP.enrolments.find(x=>x.course===c.id);
  if(e){ e.progress=Math.min(100,Math.round(Object.keys(APP.learn.done).length/lessonCount(c)*100)); }
  toast('Lesson complete');
  stepLesson(1);
}

    <div class="mh">${I('i-cal-check','ic-lg')}<h3>Confirm your session</h3><button class="icb" onclick="closeModal()">${I('i-x','ic-sm')}</button></div>
    <div class="mb">

        <div class="r"><span>Date</span><b>${d}</b></div>
        <div class="r"><span>Time</span><b>${time||'09:00 – 13:00'}</b></div>
        <div class="r"><span>Location</span><b>Skills Lab A, ${ACADEMY.address}</b></div>

/* ---------- certificates ---------- */
function viewCerts(){
  const done=APP.enrolments.filter(e=>e.status==='completed');
  const active=APP.enrolments.filter(e=>e.status==='active');
  const body=`
    ${done.length?`<div class="certs" style="margin-bottom:26px">${done.map(certCard).join('')}</div>`
      :`<div class="empty"><div class="ic-w">${I('i-cert','ic-lg')}</div><h3>No certificates yet</h3>
        <p>Finish a programme and your certificate appears here the same day, ready to download and send to an employer.</p></div>`}
    ${active.length?`<div class="blk"><div class="bh">${I('i-clock','ic-lg')}<h3>In progress</h3></div>
      <div class="bc flush">${active.map(e=>{const c=byId(e.course);return `
        <div class="sess"><div class="dt"><b>${e.progress}</b><span>%</span></div>
        <div class="tx"><b>${esc(c.name)}</b><span><i>${I('i-modules','ic-sm')}${c.modules.length} modules</i>
          <i>${I('i-clock','ic-sm')}Started ${e.started}</i></span>
          <div class="bar" style="margin-top:9px"><i style="width:${e.progress}%"></i></div></div>
        <a class="btn btn-quiet btn-sm" href="#/learn/${c.id}">Continue</a></div>`;}).join('')}</div></div>`:''}`;
  return portal('Certificates',body,'certs');
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const V={home:viewHome,catalogue:viewCatalogue,course:viewCourse,enrol:viewEnrol,welcome:viewWelcome,
    signin:viewSignin,dash:viewDash,courses:viewCourses,learn:viewLearn,schedule:viewSchedule,
    certs:viewCerts,billing:viewBilling,profile:viewProfile};
  document.getElementById('app').innerHTML=(V[APP.view]||viewHome)();
  observe(); stickyHeader();
}
let io;
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.12});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
function stickyHeader(){
  const h=document.getElementById('hdr'); if(!h) return;
  const f=()=>h.classList.toggle('stuck',window.scrollY>10);
  window.removeEventListener('scroll',window.__hf); window.__hf=f; window.addEventListener('scroll',f,{passive:true}); f();
}
readHash(); render();
</script>
