<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Console | TCH Arms</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/console.css?v=1">
</head>
<body>

<div class="app">

  <!-- ============================================================ sidebar -->
  <aside class="side" id="side">
    <div class="side-logo">
      <a href="index.html"><img src="assets/brand/tch-logo-light.webp" alt="TCH Arms"></a>
      <div class="tagline">Admin Console</div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="who">
        <span class="avatar">TC</span>
        <span>
          <span class="n">Tom Cahill</span>
          <span class="r">Store owner</span>
        </span>
      </div>
      <a class="btn btn-ghost btn-sm" href="index.html" style="width:100%;margin-top:11px">View storefront</a>
    </div>
  </aside>

  <!-- ============================================================ main -->
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn-ghost btn-sm" href="admin.html">Media Manager</a>
      </div>
    </header>

    <section class="view is-active" id="viewDashboard"></section>
    <section class="view" id="viewOrders"></section>
    <section class="view" id="viewProducts"></section>
    <section class="view" id="viewTypes"></section>
    <section class="view" id="viewContent"></section>
    <section class="view" id="viewCustomers"></section>
    <section class="view" id="viewDealers"></section>
    <section class="view" id="viewSettings"></section>
  </div>
</div>

<!-- ============================================================ overlays -->
<div class="veil" id="veil"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head">
    <h3 id="modalTitle"></h3>
    <button class="x" id="modalX" aria-label="Close">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
</div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h3 id="drawerTitle"></h3>
    <button class="x" id="drawerX" aria-label="Close">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<div class="chart-tip" id="chartTip"></div>
<div class="toasts" id="toasts"></div>

<script src="js/console-data.js?v=1"></script>
<script src="js/console.js?v=1"></script>
</body>
</html>
