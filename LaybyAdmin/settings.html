<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Personal info · Settings · LayBys.com Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page">

      <div class="page-head">
        <div>
          <h1 class="page-title">Settings</h1>
          <p class="page-sub">Workspace configuration · platform-wide</p>
        </div>
      </div>

      <div class="grid-2" style="grid-template-columns:240px 1fr;margin-top:8px">

        <aside class="settings-nav">
          <div class="settings-nav-group">
            <div class="settings-nav-label">PROFILE</div>
            <a class="settings-nav-link active" href="settings.html">Personal info</a>
            <a class="settings-nav-link" href="settings-security.html">Security</a>
          </div>
          <div class="settings-nav-group">
            <div class="settings-nav-label">PLATFORM</div>
            <a class="settings-nav-link" href="settings-legal.html">Legal &amp; policies</a>
          </div>
          <div class="settings-nav-group">
            <div class="settings-nav-label">TEAM</div>
            <a class="settings-nav-link" href="settings-admin-users.html">Admin users</a>
            <a class="settings-nav-link" href="settings-roles.html">Roles &amp; permissions</a>
          </div>
        </aside>

        <div>

          <div class="card">
            <div class="card-head"><h3 class="card-title">Personal Information</h3></div>
            <div class="profile-head" style="padding:0 24px;display:flex;align-items:center;gap:18px">
              <div class="avatar avatar-xl">GR</div>
              <div>
                <div style="font-size:18px;font-weight:600;color:var(--m3-on-surface);font-family:var(--md-font-display)">Greg Rogers</div>
                <div style="color:var(--m3-on-surface-variant);margin-top:2px;font-size:13.5px">Owner · Super Admin · Rogers Digital Pty Ltd</div>
                <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm">Upload Photo</button><button class="btn btn-ghost btn-sm">Remove</button></div>
              </div>
            </div>
            <div class="form-grid form-grid-2" style="margin-top:20px">
              <div class="field"><label class="field-label">First name</label><input class="input" value="Greg"></div>
              <div class="field"><label class="field-label">Last name</label><input class="input" value="Rogers"></div>
              <div class="field"><label class="field-label">Email</label><input class="input" value="greg@laybys.com"></div>
              <div class="field"><label class="field-label">Mobile</label><input class="input" value="+61 412 000 220"></div>
              <div class="field"><label class="field-label">Role</label><input class="input" value="Owner / Super Admin" disabled></div>
              <div class="field"><label class="field-label">Time zone</label><select class="select"><option>Australia/Sydney (AEST)</option><option>Australia/Melbourne</option><option>Australia/Brisbane</option><option>Australia/Perth</option></select></div>
            </div>
          </div>

          <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost">Discard Changes</button>
            <button class="btn btn-primary">Save Changes</button>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>
<script src="admin.js"></script>
<script>LBAdmin.mount('settings','Settings','Personal info');</script>
</body>
</html>
