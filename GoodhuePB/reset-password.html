<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Reset Password — GoodhuePB</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="wf-banner">
  <span><a href="index.html">← Sitemap</a> &nbsp; · &nbsp; <strong>Reset Password</strong></span>
  <span>Set a new password from the email link.</span>
</div>

<div class="login">
  <aside class="login-hero">
    <div class="brand">
      <img src="logo.svg" alt="GoodhuePB" class="brand-mark brand-mark-lg" />
      </div>
    <div>
      <h1>ALMOST<br /><span class="h1-accent">THERE</span></h1>
      <p class="tagline">Pick a new password and you'll be back logging sessions in seconds.</p>
    </div>
    <div style="font-size:11px;color:#94A3B8">🔒 Password must be at least 6 characters.</div>
  </aside>

  <section class="login-form-wrap">
    <div class="form-logo"><img src="logo.svg" alt="GoodhuePB" /></div>
    <h2>Choose a new password</h2>
    <p class="sub">For alex.chen@example.com</p>

    <form>
      <div class="field">
        <label>New password</label>
        <div class="input-icon">
          <span class="ico">🔒</span>
          <input class="input" type="password" placeholder="At least 6 characters" />
        </div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <div class="input-icon">
          <span class="ico">🔒</span>
          <input class="input" type="password" placeholder="Repeat password" />
        </div>
      </div>

      <a href="login.html" class="btn btn-primary btn-block btn-lg">Reset Password →</a>

      <div class="signup-cta">
        <a href="login.html">Back to sign in</a>
      </div>
    </form>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
