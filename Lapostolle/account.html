<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Lapostolle Wines</title>
<link rel="icon" href="assets/site/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<section class="sec" style="padding-top:150px;min-height:88vh">
  <div class="wrap">

    <!-- LOGIN -->
    <div id="loginView" style="max-width:480px;margin:0 auto" hidden>
      <div class="tc">
        <div class="eyebrow center rv" style="justify-content:center">Customer account</div>
        <h1 class="h-1 rv" style="--d:.1s;margin:14px 0 8px">Welcome back</h1>
        <p class="muted rv" style="--d:.15s;margin:0 0 34px">Sign in to view orders, track deliveries and manage your details.</p>
      </div>
      <div class="co-panel rv" style="--d:.2s">
        <div class="field"><label>Email</label><input type="email" id="liEmail" placeholder="you@example.co.uk"></div>
        <div class="field"><label>Password</label><input type="password" id="liPass" placeholder="••••••••"></div>
        <div class="demo-note" style="margin:4px 0 18px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.2"/><path d="M12 10.8v6M12 7.4v.4"/></svg>
          Sample mode: any email and password will sign you in.
        </div>
        <button class="btn solid" style="width:100%" onclick="signIn()">Sign in</button>
        <p class="tc muted" style="font-size:13px;margin:18px 0 0">New to Lapostolle? <a class="gold" href="#" onclick="event.preventDefault(); signIn(true)">Create an account</a></p>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="acctView" hidden>
      <div class="sec-head" style="margin-bottom:30px">
        <div>
          <div class="eyebrow rv">My account</div>
          <h1 class="h-1 rv" style="--d:.1s">Hello, <span class="italic gold" id="acctName">Ronnie</span></h1>
        </div>
        <button class="btn sm rv" onclick="signOut()">Sign out</button>
      </div>

      <div class="acct-tabs rv">
        <button class="fchip on" data-t="orders">Orders</button>
        <button class="fchip" data-t="details">Details</button>
        <button class="fchip" data-t="prefs">Preferences</button>
      </div>

      <div id="tab-orders">
        <div class="orders-list" id="ordersList"></div>
      </div>

      <div id="tab-details" hidden style="max-width:640px">
        <div class="co-panel">
          <h2 style="font-size:26px;margin-bottom:20px">Your details</h2>
          <div class="frow">
            <div class="field"><label>First name</label><input value="Ronnie"></div>
            <div class="field"><label>Last name</label><input value="Hazell"></div>
          </div>
          <div class="field"><label>Email</label><input id="detEmail"></div>
          <div class="field"><label>Delivery address</label><textarea style="min-height:90px">14 Vintners Row, Burgess Hill, West Sussex RH15 8QY</textarea></div>
          <button class="btn solid" onclick="toast('Details saved')">Save changes</button>
        </div>
      </div>

      <div id="tab-prefs" hidden style="max-width:640px">
        <div class="co-panel">
          <h2 style="font-size:26px;margin-bottom:20px">Preferences</h2>
          <label class="check"><input type="checkbox" checked> Email me about new vintages and releases</label>
          <label class="check"><input type="checkbox" checked> Offers and mixed-case savings</label>
          <label class="check"><input type="checkbox"> Le Club allocation alerts</label>
          <button class="btn solid" onclick="toast('Preferences saved')">Save preferences</button>
        </div>
      </div>
    </div>

    <!-- ORDER DETAIL DRAWER (simple modal) -->
    <div id="orderModal" style="position:fixed;inset:0;z-index:880;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:20px">
      <div class="co-panel" style="max-width:560px;width:100%;max-height:86vh;overflow-y:auto" id="orderModalBody"></div>
    </div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
const SEED_ORDERS = [
  { ref: "LW-2026-1284", ts: "2026-07-28T11:24:00Z", status: "delivered",
    items: [{ id: "325453319", qty: 1, price: 108 }, { id: "324483793", qty: 1, price: 27.5 }],
    total: 144.5, name: "Ronnie Hazell", email: "ronnie@example.co.uk" },
  { ref: "LW-2026-1191", ts: "2026-06-14T09:05:00Z", status: "delivered",
    items: [{ id: "741242253", qty: 2, price: 125 }],
    total: 259, name: "Ronnie Hazell", email: "ronnie@example.co.uk" },
];

function allOrders() {
  const mine = LS.get("lw_orders", []);
  const seen = new Set(mine.map(o => o.ref));
  return [...mine, ...SEED_ORDERS.filter(o => !seen.has(o.ref))];
}

function signIn(isNew) {
  const email = document.getElementById("liEmail").value || "ronnie@example.co.uk";
  LS.set("lw_user", { name: "Ronnie", email });
  toast(isNew ? "Account created — welcome to Lapostolle" : "Signed in");
  render();
}
function signOut() { localStorage.removeItem("lw_user"); toast("Signed out"); render(); }

function statusChip(s) {
  const map = { delivered: ["delivered", "Delivered"], transit: ["transit", "In transit"], processing: ["processing", "Processing"] };
  const [cls, label] = map[s] || map.processing;
  return `<span class="status ${cls}">${label}</span>`;
}

function renderOrders() {
  const list = document.getElementById("ordersList");
  const orders = allOrders();
  list.innerHTML = orders.map((o, i) => `
    <div class="order-card rv" style="--d:${i * .08}s">
      <div>
        <div class="oid">${o.ref}</div>
        <div class="om">${new Date(o.ts).toLocaleDateString("en-GB", { dateStyle: "long" })} · ${o.items.reduce((a, b) => a + b.qty, 0)} item(s) · ${money(o.total)}</div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        ${statusChip(o.status)}
        <button class="btn sm" onclick="openOrder('${o.ref}')">View &amp; track</button>
      </div>
    </div>`).join("");
  list.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
}

function openOrder(ref) {
  const o = allOrders().find(x => x.ref === ref);
  const m = document.getElementById("orderModal");
  const steps = o.status === "delivered" ? 4 : o.status === "transit" ? 3 : 2;
  const names = ["Order received", "Packed at our UK warehouse", "With the courier", "Delivered"];
  const notes = [new Date(o.ts).toLocaleDateString("en-GB", { dateStyle: "long" }), "Burgess Hill, West Sussex", "Tracked — signed for by an adult 18+", "Thank you for shopping with Lapostolle"];
  document.getElementById("orderModalBody").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <h2 style="font-size:28px">${o.ref}</h2>
      <button class="hbtn" onclick="document.getElementById('orderModal').style.display='none'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    ${o.items.map(it => { const p = findProduct(it.id); return `
      <div class="cs-item">
        <div class="im"><img src="${p.images[0]}" alt=""><span class="q">${it.qty}</span></div>
        <div><div class="nm">${p.name} ${p.vintage || ""}</div><div class="muted" style="font-size:11.5px">${p.range}</div></div>
        <span class="pr">${money(it.price * it.qty)}</span>
      </div>`; }).join("")}
    <div class="cart-line" style="margin-top:14px"><span>Delivery — flat rate</span><span>${money(9)}</span></div>
    ${o.discount ? `<div class="cart-line"><span>Discount (${o.discount})</span><span class="gold">applied</span></div>` : ""}
    <div class="cart-line total"><span>Total</span><span>${money(o.total)}</span></div>
    <div class="timeline" style="margin-top:30px">
      ${names.map((n, i) => `
        <div class="tl-row ${i < steps ? "done" : ""}">
          <div class="tl-dot">${i < steps ? "✓" : ""}</div>
          <div><h4>${n}</h4><p>${notes[i]}</p></div>
        </div>`).join("")}
    </div>`;
  m.style.display = "flex";
  m.onclick = e => { if (e.target === m) m.style.display = "none"; };
}

function render() {
  const user = LS.get("lw_user", null);
  document.getElementById("loginView").hidden = !!user;
  document.getElementById("acctView").hidden = !user;
  if (user) {
    document.getElementById("acctName").textContent = user.name || "Ronnie";
    const de = document.getElementById("detEmail"); if (de) de.value = user.email;
    renderOrders();
  }
  document.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
}

document.addEventListener("DOMContentLoaded", () => {
  render();
  document.querySelectorAll(".acct-tabs .fchip").forEach(b => b.onclick = () => {
    document.querySelectorAll(".acct-tabs .fchip").forEach(x => x.classList.toggle("on", x === b));
    ["orders", "details", "prefs"].forEach(t => document.getElementById("tab-" + t).hidden = t !== b.dataset.t);
  });
});
</script>
</body>
</html>
